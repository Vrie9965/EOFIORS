#!/bin/bash

# * Fill the Required Variables for Anniversary Replay Mode
# This config replays episodes in order (starting from episode 1) for the first anniversary

# Episode Configuration
replay_episode="01"          # Current episode being replayed (with leading zero)
replay_season="1"            # Season of the episode
replay_start_frame="1"       # Starting frame of current episode

# Message/Caption for anniversary replay (simple text)
# The script will automatically prepend: Season X, Episode X, Frame X -
replay_message='OnimaiFrames 2 year old replay.'

# Frame tracking file for anniversary mode (stores current frame number)
FRMENV_REPLAY_ITER_FILE=./fb/anniversaryiterator

# env variables (inherited from main config if needed)
FRMENV_API_ORIGIN="https://graph.facebook.com"
FRMENV_FRAME_LOCATION=./frames
FRMENV_LOG_FILE=./fb/log.txt
FRMENV_FBAPI_VER="v20.0"
