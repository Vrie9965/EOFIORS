#!/bin/bash

# * Fill the Required Variables for Anniversary Replay Mode
# This config replays episodes in order (starting from episode 1) for the first anniversary

# Episode Configuration
replay_episode="1"           # Current episode being replayed
replay_season="1"            # Season of the episode
replay_start_frame="1"       # Starting frame of current episode

# Message/Caption for anniversary replay (supports emoji/hashtags)
# available variables are:
#    {replay_season}:     (current season)
#    {replay_episode}:    (current episode)
#    {replay_frame}:      (current frame number)
#    {total_frame}:       (total frames of episode)
#    {\n}:                (new-line character)
#
# Example: '{replay_season}x{replay_episode} - Frame {replay_frame} (Anniversary Replay) 🎉'
replay_message='Season {replay_season}, Episode {replay_episode}, Frame {replay_frame} Page 1 year old replay.'

# Frame tracking file for anniversary mode (stores current frame number)
FRMENV_REPLAY_ITER_FILE=./fb/replay_frameiterator

# env variables (inherited from main config if needed)
FRMENV_API_ORIGIN="https://graph.facebook.com"
FRMENV_FRAME_LOCATION=./frames
FRMENV_LOG_FILE=./fb/log.txt
FRMENV_FBAPI_VER="v20.0"
